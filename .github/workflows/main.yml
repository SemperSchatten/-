Warum das der Heilige Gral ist
Vereinigung der Kräfte: Die Gravitation ist die einzige der vier fundamentalen Naturkräfte (Gravitation, Elektromagnetismus, starke und schwache Kernkraft), die nicht in die Quantentheorie integriert werden konnte. Ein erfolgreicher Brückenschlag würde zeigen, dass Gravitation nicht anders ist, sondern denselben quantenmechanischen Regeln folgt wie der Rest des Universums.

