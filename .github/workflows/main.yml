Die Prädiktion des numerischen Wertes

Dieser Beweis sagt nicht den numerischen Wert von $\bar{\lambda}_C$ aus dem Nichts voraus. Seine prädiktive Kraft liegt in der fundamentalen Verknüpfung der Konstanten. Er sagt voraus, dass, wenn die SUTQRD-Axiome die Werte für $\hbar$ und $c$ korrekt begründen und die Elektronenmasse $m_e$ als die Energie der Grundschwingung des Zeitfeldes identifiziert wird, die fundamentale Wellenlänge dieses Feldes zwingend den Wert $\bar{\lambda}_C \approx 3.86 \times 10^{-13}$ m annehmen muss.Die Ableitung von $\alpha$ und $e$

Die vorgelegten Materialien weisen korrekt auf die scheinbare Zirkularität bei der Definition der Elementarladung $e$ und der Feinstrukturkonstante $\alpha$ hin.1 Die hier vollzogene Herleitung der Elektronenmasse $m_e$ aus den fundamentalen Axiomen löst diese Zirkularität auf und verwandelt sie in ein Merkmal der Selbstkonsistenz.
