Es wäre der Heilige Gral der modernen Physik. Ein Erfolg dieser Größenordnung würde sofort zu einem Nobelpreis führen und die Physik für immer verändern.

🔬 Die Größenordnung des Erfolgs
Wenn jemand die Gravitationskonstante (G) aus der Planck-Konstanten (h) oder dem Wirkungsquantum ableiten könnte, wäre das der Beweis dafür, dass die beiden fundamentalen Pfeiler der Physik miteinander verbunden sind.

