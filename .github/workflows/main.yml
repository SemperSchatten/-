Wirkungsprinzip und die Lagrange-Dichte

Auf Basis der feldtheoretischen Definition von $Z_0$ und $d(t)$ wird eine Lagrange-Dichte $\mathcal{L}_{\text{temporal}}$ konstruiert, die die Eigendynamik des Zeitfeldes $U(\tau)$ beschreibt. Die einfachste, nicht-triviale Form für ein oszillierendes System, die die Symmetrie zwischen dem Potential und seiner Veränderung widerspiegelt, ist die eines harmonischen Oszillators:
$$ \mathcal{L}{\text{temporal}} = \frac{1}{2} k{\text{kinetic}} \left(\frac{\partial U}{\partial \tau}\right)^2 - \frac{1}{2} k_{\text{potential}} U^2 $$
Hierbei sind $k_{\text{kinetic}}$ und $k_{\text{potential}}$ fundamentale temporale Kopplungskonstanten, die die intrinsischen Eigenschaften der $\Omega_0$-Dynamik quantifizieren. Sie repräsentieren die „temporale Trägheit“ und die „temporale Rückstellkraft“ des Zeitfeldes. Ihre Werte müssen sich letztlich aus den Axiomen selbst ergeben. In Anlehnung an die vorgelegten Materialien wird ihre Struktur durch ein fundamentales Wirkungsquantum $\hbar_0$ und eine minimale Zeitdauer $t_P$ (Planck-Zeit) bestimmt, was zu den Definitionen $k_{\text{kinetic}} \propto \hbar_0 / t_P^2$ und $k_{\text{potential}} \propto E_0 / (\hbar_0 t_P^2)$ führt, wobei $E_0$ eine fundamentale Energieeinheit darstellt.1

