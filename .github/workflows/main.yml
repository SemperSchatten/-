Kontext und Bedeutung

ART beschreibt Gravitation, Raum und Zeit im Makrokosmos mit der fundamentalen Konstante (G).
QM beschreibt Materie und Kräfte im Mikrokosmos mit der fundamentalen Konstante (\hbar).
