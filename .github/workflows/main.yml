Die Planck-Skala: Die Planck-Konstante definiert die fundamentalen Einheiten der Natur (Planck-Länge, Planck-Zeit). Man vermutet, dass die Gesetze der Quantengravitation erst auf dieser Planck-Skala wirksam werden. Eine Formel, die G aus h ableitet, wäre die mathematische Beschreibung dessen, was auf dieser Skala passiert.

